<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ProjectZero</title>
<style>
:root{--bg:#f4f6fa;--panel:#fff;--soft:#eef1f6;--line:#d9dee7;--text:#18202c;--muted:#5a6578;--accent:#2a5bd7;--accent-text:#fff;--good:#1d7a46;--warn:#9a5b00;--bad:#b42318;--mine:#e3ebff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1e2125;--panel:#262a2f;--soft:#2f343a;--line:#3a4047;--text:#e4e7eb;--muted:#a3aab4;--accent:#7ea6ff;--accent-text:#10141c;--good:#5cc98d;--warn:#e3ad52;--bad:#ff8378;--mine:#2e3a52}}
:root[data-theme=dark]{--bg:#1e2125;--panel:#262a2f;--soft:#2f343a;--line:#3a4047;--text:#e4e7eb;--muted:#a3aab4;--accent:#7ea6ff;--accent-text:#10141c;--good:#5cc98d;--warn:#e3ad52;--bad:#ff8378;--mine:#2e3a52}
.ico{width:1.05em;height:1.05em;flex:none;vertical-align:-.15em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav li button .label{display:flex;gap:.5rem;align-items:center;min-width:0}
header .logo{display:flex;align-items:center;gap:.45rem}header .logo .ico{width:1.4em;height:1.4em;color:var(--accent)}
.iconbtn{display:flex;align-items:center;gap:.35rem}
label.field{display:block;margin-top:.6rem;font-size:.88rem}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:.45rem .8rem}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
button:disabled{opacity:.55;cursor:not-allowed}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.5rem .6rem;width:100%}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:250px minmax(0,1fr) 310px;grid-template-rows:auto minmax(0,1fr);height:100vh;height:100dvh}
header{grid-column:1/-1;display:flex;align-items:center;gap:1rem;padding:.6rem 1rem;background:var(--panel);border-bottom:1px solid var(--line)}
header .logo{font-weight:800;letter-spacing:.02em}
header .server{color:var(--muted);font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .spacer{flex:1}
.dot{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;background:var(--muted);margin-right:.35rem;vertical-align:middle}
.dot.on{background:var(--good)}.dot.off{background:var(--bad)}
nav{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:.75rem}
nav h2{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:1rem .25rem .35rem;display:flex;justify-content:space-between;align-items:center}
nav h2 button{padding:.05rem .45rem;font-size:.85rem}
nav ul{list-style:none;margin:0;padding:0}
nav li button{width:100%;text-align:left;border:0;background:none;padding:.4rem .5rem;border-radius:6px;display:flex;gap:.4rem;align-items:center;justify-content:space-between}
nav li button[aria-current="true"]{background:var(--mine);font-weight:600}
nav li button:hover{background:var(--soft)}
.badge{background:var(--accent);color:var(--accent-text);border-radius:999px;font-size:.72rem;padding:0 .4rem}
.muted{color:var(--muted)}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.chathead{padding:.7rem 1rem;border-bottom:1px solid var(--line);background:var(--panel);display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}
.chathead h1{font-size:1.05rem;margin:0;flex:1;min-width:8rem}
.chathead select{width:auto}
.log{flex:1;overflow:auto;padding:1rem;display:flex;flex-direction:column;gap:.6rem}
.msg{max-width:46rem;padding:.55rem .8rem;border-radius:12px;background:var(--panel);border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}
.msg.mine{align-self:flex-end;background:var(--mine)}
.msg code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.9em;background:var(--soft);border-radius:4px;padding:.05rem .3rem}
.msg pre.code{background:var(--soft);border-radius:8px;padding:.6rem;overflow:auto;white-space:pre;margin:.4rem 0}
.msg pre.code code{background:none;padding:0}
.msg .who{font-size:.78rem;color:var(--muted);margin-bottom:.15rem}
.msg.system{align-self:center;background:none;border:0;color:var(--muted);font-size:.88rem;text-align:center}
.pending-timeline{font-size:.76rem;color:var(--muted);margin-top:.2rem;display:flex;flex-direction:column;gap:.1rem}
.pending-timeline .ev-failed,.pending-timeline .ev-requeued{color:var(--warn)}
.pending-dots{display:inline-flex;gap:.22rem;margin-left:.45rem;vertical-align:middle}
.pending-dots span{width:.38rem;height:.38rem;border-radius:50%;background:var(--muted);animation:pz-bounce 1.1s infinite ease-in-out both}
.pending-dots span:nth-child(2){animation-delay:.15s}
.pending-dots span:nth-child(3){animation-delay:.3s}
@keyframes pz-bounce{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-.2rem)}}
@media (prefers-reduced-motion:reduce){.pending-dots span{animation:none;opacity:.6}}
.composer{display:flex;gap:.5rem;padding:.75rem 1rem;border-top:1px solid var(--line);background:var(--panel)}
.composer textarea{resize:none;height:3rem}
aside{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:1rem;display:flex;flex-direction:column;gap:1rem}
.card{background:var(--soft);border-radius:12px;padding:.9rem}
.card h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 .5rem}
.credits{font-size:2.4rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;gap:.5rem;font-size:.9rem;margin-top:.2rem}
.slider{margin-top:.7rem}
.slider label{display:flex;justify-content:space-between;font-size:.88rem}
.slider input{padding:0;border:0;background:none}
.switch{display:flex;align-items:center;gap:.6rem;font-weight:600}
.switch input{width:1.2rem;height:1.2rem}
.note{font-size:.82rem;color:var(--muted)}
.warn{color:var(--warn)}.bad{color:var(--bad)}.good{color:var(--good)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);max-width:30rem;width:calc(100% - 2rem);padding:1.25rem}
dialog::backdrop{background:#0008}
dialog h2{margin-top:0}
dialog label{display:block;margin:.8rem 0 .25rem;font-weight:600}
.actions{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem;flex-wrap:wrap}
.tabs{display:flex;gap:.5rem;margin:.5rem 0}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-text)}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mobile-tabs{display:none}
@media (max-width:900px){
 .app{grid-template-columns:1fr;grid-template-rows:auto auto minmax(0,1fr)}
 .mobile-tabs{display:flex;gap:.25rem;padding:.4rem;background:var(--panel);border-bottom:1px solid var(--line)}
 .mobile-tabs button{flex:1}
 .mobile-tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
 header{flex-wrap:wrap;gap:.4rem .6rem;padding:.5rem .75rem}
 header .spacer{display:none}
 header .logo{flex:1}
 header .server{order:9;flex:1 1 100%;min-width:0;font-size:.82rem}
 #whoami{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40vw}
 input,select,textarea{font-size:16px}
 #ai-controls{display:flex;flex-wrap:wrap;gap:.4rem;min-width:0;max-width:100%}
 .chathead select{max-width:100%}
 .composer{padding:.5rem .75rem}
 nav,aside,main{display:none}
 .app[data-view="nav"] nav,.app[data-view="main"] main,.app[data-view="aside"] aside{display:flex;flex-direction:column}
 nav{display:none}
 .app[data-view="nav"] nav{display:block}
}
</style>
</head>
<body>
<div class="app" id="app" data-view="main">
<header>
  <span class="logo"><span data-icon="logo"></span>ProjectZero</span>
  <span class="server" id="server"><span class="dot" id="server-dot"></span><span id="server-text" data-i18n="notConnected"></span></span>
  <span class="spacer"></span>
  <span id="whoami" class="muted"></span>
  <button id="lang-btn" class="iconbtn" data-i18n-aria="langSwitch"><span data-icon="globe"></span><span id="lang-label">EN</span></button>
  <button id="theme-btn" class="iconbtn" data-i18n-aria="themeSwitch"><span data-icon="theme"></span><span id="theme-label"></span></button>
  <button id="account-btn" aria-haspopup="dialog" data-i18n="account"></button>
</header>
<div class="mobile-tabs" role="tablist" data-i18n-aria="view">
  <button role="tab" aria-selected="false" data-view="nav" data-i18n="tabChannels"></button><button role="tab" aria-selected="true" data-view="main" data-i18n="tabChat"></button><button role="tab" aria-selected="false" data-view="aside" data-i18n="tabCredits"></button>
</div>

<nav data-i18n-aria="channels">
  <ul><li><button data-channel="ai" aria-current="true"><span class="label"><span data-icon="ai"></span><span data-i18n="aiChat"></span></span></button></li></ul>
  <h2><span data-i18n="rooms"></span></h2><ul id="rooms"></ul>
  <h2><span data-i18n="groups"></span> <button id="new-group" data-i18n-aria="newGroup"><span data-icon="plus"></span></button></h2><ul id="groups"></ul>
  <h2><span data-i18n="direct"></span> <button id="new-dm" data-i18n-aria="newDirect"><span data-icon="plus"></span></button></h2><ul id="directs"></ul>
  <h2><span data-i18n="onlineNow"></span></h2><ul id="online"></ul>
  <p class="note" id="online-note"></p>
</nav>

<main>
  <div class="chathead">
    <h1 id="chat-title"></h1>
    <span id="ai-controls">
      <label class="sr" for="model" data-i18n="model"></label><select id="model"></select>
      <label class="sr" for="privacy" data-i18n="whoProcesses"></label>
      <select id="privacy">
        <option value="community" data-i18n="privCommunity"></option>
        <option value="trusted" data-i18n="privTrusted"></option>
      </select>
    </span>
    <span id="group-controls" class="hidden"><button id="add-member" data-i18n="addMember"></button> <button id="leave-group" data-i18n="leave"></button></span>
  </div>
  <div class="log" id="log" aria-live="polite"></div>
  <form class="composer" id="composer">
    <label for="input" class="sr" data-i18n="message"></label>
    <textarea id="input" data-i18n-placeholder="composerHint"></textarea>
    <button class="primary" id="send" type="submit" data-i18n="send"></button>
  </form>
</main>

<aside data-i18n-aria="creditsAndCompute">
  <section class="card" aria-labelledby="credits-h">
    <h2 id="credits-h" data-i18n="yourCredits"></h2>
    <div class="credits" id="credits">-</div>
    <div class="row"><span data-i18n="provisional"></span><b id="provisional">-</b></div>
    <div class="row"><span data-i18n="autoCredited"></span><b id="earned">-</b></div>
    <div class="row"><span data-i18n="costPerAnswer"></span><b id="cost">-</b></div>
    <p class="note" data-i18n="creditsNote"></p>
  </section>
  <section class="card" aria-labelledby="machine-h">
    <h2 id="machine-h" data-i18n="myCompute"></h2>
    <label class="switch"><input type="checkbox" id="contribute"> <span data-i18n="shareCompute"></span></label>
    <div class="row"><span data-i18n="status"></span><b id="worker-status"></b></div>
    <div class="row"><span data-i18n="jobsDone"></span><b id="jobs-done">0</b></div>
    <p class="note bad" id="worker-error"></p>
    <label class="field" for="machine-name" data-i18n="deviceName"></label>
    <input id="machine-name" maxlength="40" data-i18n-placeholder="deviceNameHint">
    <label class="field" for="machine-model" data-i18n="deviceModel"></label>
    <select id="machine-model"></select>
    <label class="field" for="backend" data-i18n="execution"></label>
    <select id="backend"><option value="ollama" data-i18n="backendOllama"></option><option value="mock" data-i18n="backendMock"></option></select>
    <p class="note" id="ollama-note"></p>
    <button id="pull" class="hidden"></button>
    <div class="slider"><label for="cpu_threads"><span data-i18n="cpuThreads"></span> <b id="cpu_threads-v"></b></label><input type="range" id="cpu_threads" min="1" max="8"></div>
    <div class="slider"><label for="gpu_layers"><span data-i18n="gpuLayers"></span> <b id="gpu_layers-v"></b></label><input type="range" id="gpu_layers" min="0" max="99"></div>
    <div class="slider"><label for="max_output_tokens"><span data-i18n="maxAnswer"></span> <b id="max_output_tokens-v"></b></label><input type="range" id="max_output_tokens" min="16" max="512" step="16"></div>
    <div class="slider"><label for="context_tokens"><span data-i18n="context"></span> <b id="context_tokens-v"></b></label><input type="range" id="context_tokens" min="512" max="8192" step="512"></div>
    <p class="note" data-i18n="sliderNote"></p>
  </section>
  <section class="card" aria-labelledby="privacy-h">
    <h2 id="privacy-h" data-i18n="goodToKnow"></h2>
    <p class="note" data-i18n="privacyNote"></p>
  </section>
</aside>
</div>

<dialog id="setup" aria-labelledby="setup-h">
  <h2 id="setup-h" data-i18n="welcome"></h2>
  <div id="step-server">
    <p data-i18n="whichServer"></p>
    <label for="server-url" data-i18n="serverAddress"></label>
    <input id="server-url" placeholder="http://127.0.0.1:8765" value="http://127.0.0.1:8765">
    <p class="note" data-i18n="serverHint"></p>
    <p class="bad" id="server-error" role="alert"></p>
    <div class="actions"><button class="primary" id="server-next" data-i18n="next"></button></div>
  </div>
  <div id="step-account" class="hidden">
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" id="tab-register" data-i18n="registerTab"></button>
      <button role="tab" aria-selected="false" id="tab-login" data-i18n="loginTab"></button>
    </div>
    <div id="pane-register">
      <label for="reg-name" data-i18n="displayName"></label>
      <input id="reg-name" maxlength="24" autocomplete="nickname">
      <div id="invite-box" class="hidden"><label for="reg-invite" data-i18n="inviteCode"></label><input id="reg-invite" maxlength="40"></div>
      <p class="note" id="reg-note"></p>
    </div>
    <div id="pane-login" class="hidden">
      <label for="login-token" data-i18n="accessKey"></label>
      <input id="login-token" type="password" autocomplete="off">
    </div>
    <p class="bad" id="account-error" role="alert"></p>
    <div class="actions"><button id="account-back" data-i18n="back"></button><button class="primary" id="account-next" data-i18n="letsGo"></button></div>
  </div>
</dialog>

<dialog id="account" aria-labelledby="account-h">
  <h2 id="account-h" data-i18n="account"></h2>
  <p id="account-info"></p>
  <p class="note" data-i18n="keyWarning"></p>
  <pre id="token-out" class="hidden" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre>
  <div class="actions"><button id="show-token" data-i18n="showKey"></button><button id="change-server" data-i18n="changeServer"></button><button id="logout" data-i18n="signOut"></button><button class="primary" id="account-close" data-i18n="close"></button></div>
</dialog>

<script>
"use strict";
const SESSION="__PZ_SESSION__";
const $=id=>document.getElementById(id);

async function call(path,options={}){
  const r=await fetch(path,{...options,headers:{"X-PZ-Session":SESSION,"Content-Type":"application/json",...(options.headers||{})}});
  let body=null;try{body=await r.json()}catch(e){}
  if(!r.ok){const d=body&&body.detail;throw new Error(typeof d==="string"?d:(d?JSON.stringify(d):t("error")+" "+r.status))}
  return body;
}

// Minimal, safe Markdown subset for AI answers: ```code blocks```, `inline code`, **bold**.
// Builds DOM nodes with textContent only; never interprets HTML.
function md(text){const frag=document.createDocumentFragment();const parts=String(text).split(/```[a-zA-Z0-9_-]*\n?/);
  parts.forEach((part,i)=>{if(i%2===1){frag.append(el("pre",{class:"code"},el("code",{text:part.replace(/\n$/,"")})));return}
    for(const tok of part.split(/(`[^`\n]+`|\*\*[^*\n]+\*\*)/)){if(!tok)continue;
      if(tok.startsWith("`")&&tok.endsWith("`")&&tok.length>2)frag.append(el("code",{text:tok.slice(1,-1)}));
      else if(tok.startsWith("**")&&tok.endsWith("**")&&tok.length>4)frag.append(el("strong",{text:tok.slice(2,-2)}));
      else frag.append(tok)}});return frag}

async function refreshLocal(){

  $("whoami").replaceChildren(...(L.name?[label("person",L.name)]:[]));
  const s=L.settings||{};$("contribute").checked=!!s.contribute;$("backend").value=s.backend||"ollama";
  for(const k of["cpu_threads","gpu_layers","max_output_tokens","context_tokens"]){const i=$(k);if(document.activeElement!==i){i.value=s[k];$(k+"-v").textContent=s[k]}}
  $("cpu_threads").max=Math.min(8,L.hardware.cpu_logical||8);$("gpu_layers").disabled=!L.hardware.nvidia_gpu;
  if(!L.hardware.nvidia_gpu)$("gpu_layers-v").textContent="-";
  const w=L.worker||{};$("worker-status").textContent=!s.contribute?t("off"):(w.running?(w.job_status==="running"?t("computing"):(w.connected===false?t("noConnection"):t("ready"))):t("stopped"));
  $("worker-status").className=s.contribute&&w.running&&w.connected!==false?"good":"";
  $("jobs-done").textContent=w.jobs_completed||0;$("worker-error").textContent=w.error||(s.contribute?(w.last_error||""):"");

  const o=L.ollama;$("ollama-note").textContent=s.backend==="mock"?t("mockNote"):(o.available?t("ollamaFound",{n:o.models.length}):t("ollamaMissing"));

  const o=state.local.ollama;const need=$("backend").value==="ollama"&&o.available&&sel.value&&sel.value!=="demo-model"&&!o.models.includes(sel.value);

function eventLabel(e){switch(e.type){

function renderPending(pendingLine,pendingText,pendingTimeline,s){
  const lastWorker=[...s.events].reverse().find(e=>e.worker&&e.type!=="requeued"&&e.type!=="failed")?.worker;
  const busy=s.status==="queued"||s.status==="running";
  pendingText.textContent=s.status==="queued"?(s.available_workers>0?t("waitingCount",{n:s.available_workers}):t("waitingNone")):
    s.status==="running"?(lastWorker?t("workingNamed",{worker:lastWorker}):t("working")):pendingText.textContent;
  setPendingDots(pendingLine,busy);
  pendingTimeline.replaceChildren(...s.events.map(e=>{const{text,cls}=eventLabel(e);
    return el("div",{class:cls,text:`${new Date(e.t).toLocaleTimeString(lang,{hour:"2-digit",minute:"2-digit",second:"2-digit"})} - ${text}`})}))}

  if(privacy==="community"&&!consented){if(!confirm(t("consent")))return;try{localStorage.setItem("pz-consent","1")}catch(e){}}
  state.ai.push({role:"user",content:text});renderAi();
  const pendingText=el("span",{text:t("sending")});const pendingLine=el("div",{},pendingText,dots());
  const pendingTimeline=el("div",{class:"pending-timeline"});
  const pending=el("div",{class:"msg system"},pendingLine,pendingTimeline);$("log").append(pending);scrollLog();
  const history=state.ai.slice(-15).map(m=>({role:m.role,content:m.content}));
  try{const job=await post("/api/jobs",{model,privacy,allow_untrusted:privacy==="community",messages:history,max_output_tokens:256});refreshMe();
    for(let i=0;i<200;i++){await sleep(i<10?1000:3000);const s=await call("/api/jobs/"+job.id);renderPending(pendingLine,pendingText,pendingTimeline,s);
      if(s.status==="completed"){state.ai.push({role:"assistant",content:s.output.content,model});renderAi();refreshMe();return}
      if(s.status==="failed"||s.status==="cancelled"){setPendingDots(pendingLine,false);pendingText.textContent=t("noAnswer",{reason:s.error||s.status});refreshMe();return}}
    setPendingDots(pendingLine,false);pendingText.textContent=t("tooLong")}
  catch(e){setPendingDots(pendingLine,false);pendingText.textContent=t("error")+": "+e.message;state.ai.pop()}}
$("composer").onsubmit=async e=>{e.preventDefault();const text=$("input").value.trim();if(!text)return;$("input").value="";$("send").disabled=true;
  try{if(state.active==="ai")await askAi(text);else{await post(`/api/channels/${encodeURIComponent(state.active)}/messages`,{body:text});await pollMessages(false)}}catch(err){sysmsg(t("error")+": "+err.message)}finally{$("send").disabled=false;$("input").focus()}};
$("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("composer").requestSubmit()}});

// ---------------------------------------------------------------- my machine
async function saveSettings(values){try{await post("/local/settings",values);await refreshLocal()}catch(e){alert(e.message)}}
async function registerMachine(){const name=$("machine-name").value.trim()||t("myComputer");const model=$("machine-model").value;
  if(!state.local.machine||state.local.machine.model!==model||state.local.machine.name!==name)await post("/local/machine",{name,model})}
$("contribute").onchange=async()=>{const on=$("contribute").checked;if(on){try{await registerMachine()}catch(e){$("contribute").checked=false;alert(e.message);return}}await saveSettings({contribute:on})};
$("machine-model").onchange=async()=>{fillMachineModels();if($("contribute").checked){try{await registerMachine()}catch(e){alert(e.message)}await refreshLocal()}};
$("machine-name").onchange=$("machine-model").onchange;
$("backend").onchange=()=>saveSettings({backend:$("backend").value});
for(const k of["cpu_threads","gpu_layers","max_output_tokens","context_tokens"]){$(k).oninput=()=>$(k+"-v").textContent=$(k).value;$(k).onchange=()=>saveSettings({[k]:Number($(k).value)})}
$("pull").onclick=async()=>{try{await post("/local/ollama/pull",{model:$("machine-model").value});await refreshLocal()}catch(e){alert(e.message)}};

// ---------------------------------------------------------------- mobile
function setView(v){$("app").dataset.view=v;document.querySelectorAll(".mobile-tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.view===v)))}
document.querySelectorAll(".mobile-tabs button").forEach(b=>b.onclick=()=>setView(b.dataset.view));

// ---------------------------------------------------------------- loops
(async()=>{try{await refreshAll()}catch(e){sysmsg(t("appUnreachable",{msg:e.message}))}renderAi()})();
setInterval(()=>refreshLocal().catch(()=>{}),5000);
setInterval(refreshMe,8000);setInterval(refreshOnline,15000);setInterval(refreshChannels,10000);
setInterval(()=>pollMessages(false),3000);
</script>
</body>
</html>
